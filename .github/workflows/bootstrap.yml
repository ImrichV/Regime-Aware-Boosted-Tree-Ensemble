name: Expand sanitized public release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify repository bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* > /tmp/rabte-repo.tar.gz.b64
          echo "594734c3c1cf65734f7d9e9a34146ca9980d25990b8a5ea65c708ad928e6f517  /tmp/rabte-repo.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/rabte-repo.tar.gz.b64 > /tmp/rabte-repo.tar.gz
          echo "7798cc6fecc9fff8595c185e1f6c64c69d48b7187e1f2782674c115332dcb627  /tmp/rabte-repo.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/rabte-repo.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit sanitized public release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish sanitized Regime-Aware Boosted Tree Ensemble" || exit 0
          git push

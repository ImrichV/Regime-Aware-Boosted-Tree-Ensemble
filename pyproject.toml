[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-aware-boosted-tree-ensemble"
version = "0.1.0"
description = "Causal, modular market-research pipeline with specialist boosted trees and regime-aware gating"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
rabte = "tsr.__main__:main"
tsr = "tsr.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tsr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
